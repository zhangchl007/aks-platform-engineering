    platform-access.akspe.io/cluster-type: kind
    platform-access.akspe.io/visibility-groups: k8sadmin,akspe-kind-cluster-deployers
    platform-access.akspe.io/protected: "true"
    platform-access.akspe.io/allow-kind-deployers: "true"
    platform-access.akspe.io/deploy-namespace: group1-apps
spec:
  type: kubernetes-cluster
  owner: group:default/k8sadmin
  lifecycle: production
---
