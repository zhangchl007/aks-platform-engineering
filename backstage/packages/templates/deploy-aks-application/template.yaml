apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deploy-aks-application
  title: Deploy AKS Application with ArgoCD
  description: Create a GitOps pull request for an approved AKS namespace.
  tags:
    - application
    - argocd
    - gitops
    - kubernetes
    - aks
  annotations:
    platform-access.akspe.io/allowed-groups: k8sadmin,akspe-aks-cluster-deployers
    platform-access.akspe.io/protected: "true"
    platform-access.akspe.io/allow-aks-deployers: "true"
spec:
  owner: group:default/k8sadmin
  type: service

  parameters:
    - title: Application details
      backstage:permissions:
        tags:
          - aks-delivery
      required:
        - name
        - targetEnvironment
      properties:
        name:
          title: Application name
          type: string
          description: Lowercase name used for Backstage catalog, ArgoCD, and Kubernetes labels.
          default: aks-store-demo
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        targetEnvironment:
          title: Approved AKS deployment target
          type: string
          description: AKS deployment target approved by the platform AppProject.
          default: aks-gitops-aks-group2
          enum:
            - aks-gitops-aks-group2
          enumNames:
            - AKS - gitops-aks / group2-aks-apps
        owner:
          title: Service owner
          type: string
          description: Backstage owner for the generated catalog component.
          default: group:default/k8sadmin
        description:
          title: Description
          type: string
          description: Short catalog description for the application.
          default: AKS Store Demo application deployed to AKS by ArgoCD.

    - title: Application repository
      backstage:permissions:
        tags:
          - aks-delivery
      required:
        - appRepoUrl
        - appPath
      properties:
        appRepoUrl:
          title: Application repository
          type: string
          description: Repository containing the Kubernetes manifests or Kustomize overlay.
          default: github.com?owner=Azure-Samples&repo=aks-store-demo
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        appPath:
          title: Manifest path
          type: string
          description: Path inside the application repository for ArgoCD to sync.
          default: kustomize/overlays/dev
        targetRevision:
          title: Target revision
          type: string
          description: Branch, tag, or commit for ArgoCD to sync.
          default: HEAD

    - title: GitOps repository pull request
      backstage:permissions:
        tags:
          - aks-delivery
      required:
        - argoRepoUrl
        - pullRequestTitle
        - commitMessage
      properties:
        argoRepoUrl:
          title: GitOps repository
          type: string
          description: Repository watched by control-plane ArgoCD.
          default: github.com?owner=zhangchl007&repo=aks-platform-engineering
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        pullRequestTitle:
          title: Pull request title
          type: string
          default: Add AKS application GitOps definition
        commitMessage:
          title: Commit message
          type: string
          default: Add AKS application GitOps definition
        targetBranchName:
          title: GitOps target branch
          type: string
          description: Branch watched by the control-plane ArgoCD instance.
          default: zhangchl007-arc-multi-cluster-access

  steps:
    - id: fetch-repo
      name: Fetch GitOps repository
      action: fetch:plain
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        url: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}/tree/${{ parameters.targetBranchName }}
        targetPath: ./gitops-repo

    - id: render-app-gitops
      name: Render AKS application GitOps files
      action: fetch:template
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        url: ./content
        targetPath: ./gitops-repo
        values:
          name: ${{ parameters.name }}
          targetEnvironment: ${{ parameters.targetEnvironment }}
          requesterEntityRef: ${{ user.ref }}
          deliveryPersona: aks
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          appRepoUrl: https://${{ (parameters.appRepoUrl | parseRepoUrl).host }}/${{ (parameters.appRepoUrl | parseRepoUrl).owner }}/${{ (parameters.appRepoUrl | parseRepoUrl).repo }}.git
          appPath: ${{ parameters.appPath }}
          targetRevision: ${{ parameters.targetRevision }}

    - id: rename-app-folder
      name: Name application GitOps folder
      action: fs:rename
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        files:
          - from: ./gitops-repo/gitops/apps/myapp
            to: ./gitops-repo/gitops/apps/backstage-delivery/${{ parameters.name }}
          - from: ./gitops-repo/gitops/apps/backstage-delivery/${{ parameters.name }}/petArgoApp.yaml
            to: ./gitops-repo/gitops/apps/backstage-delivery/${{ parameters.name }}/${{ parameters.name }}-argocd-app.yaml
          - from: ./gitops-repo/backstage/generated/myapp
            to: ./gitops-repo/backstage/generated/${{ parameters.name }}

    - id: publish-pr
      name: Create GitOps pull request
      action: publish:github:pull-request
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        title: ${{ parameters.pullRequestTitle }}
        description: |
          Backstage request to deploy AKS application `${{ parameters.name }}`.

          This pull request adds an ArgoCD Application limited to
          `aks-team-delivery` and `gitops-aks/group2-aks-apps`.
        repoUrl: ${{ parameters.argoRepoUrl }}
        commitMessage: ${{ parameters.commitMessage }}
        sourcePath: ./gitops-repo
        branchName: backstage/aks/${{ parameters.name }}
        targetBranchName: ${{ parameters.targetBranchName }}
        update: true

    - id: register
      name: Register catalog component
      action: catalog:register
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        repoContentsUrl: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}
        catalogInfoPath: /blob/${{ parameters.targetBranchName }}/backstage/generated/${{ parameters.name }}/catalog-info.yaml
        optional: true

  output:
    links:
      - title: Pull request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
      - title: ArgoCD application manifest
        icon: catalog
        url: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}/tree/backstage/aks/${{ parameters.name }}/gitops/apps/backstage-delivery/${{ parameters.name }}/${{ parameters.name }}-argocd-app.yaml
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
