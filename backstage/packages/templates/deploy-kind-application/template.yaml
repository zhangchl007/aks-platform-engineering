apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deploy-kind-application
  title: Deploy Arc Kind Application with ArgoCD
  description: Create a GitOps pull request for approved Arc/kind namespaces.
  tags:
    - application
    - argocd
    - gitops
    - kubernetes
    - kind
    - arc
  annotations:
    platform-access.akspe.io/allowed-groups: k8sadmin,akspe-kind-cluster-deployers
    platform-access.akspe.io/protected: "true"
    platform-access.akspe.io/allow-kind-deployers: "true"
spec:
  owner: group:default/k8sadmin
  type: service

  parameters:
    - title: Application details
      backstage:permissions:
        tags:
          - kind-delivery
      required:
        - name
        - targetEnvironment
      properties:
        name:
          title: Application name
          type: string
          description: Lowercase name used for Backstage catalog, ArgoCD, and Kubernetes labels.
          default: kind-store-demo
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        targetEnvironment:
          title: Approved Arc/kind deployment target
          type: string
          description: Arc/kind deployment target approved by the platform AppProject.
          default: kind-arc-demo-vm-group1
          enum:
            - kind-arc-demo-vm-group1
            - kind-arc-demo-vm-2-group1
          enumNames:
            - Arc kind - arc-demo-vm / group1-apps
            - Arc kind - arc-demo-vm-2 / group1-apps
        owner:
          title: Service owner
          type: string
          description: Backstage owner for the generated catalog component.
          default: group:default/k8sadmin
        description:
          title: Description
          type: string
          description: Short catalog description for the application.
          default: Demo application deployed to Arc/kind by ArgoCD.

    - title: Application repository
      backstage:permissions:
        tags:
          - kind-delivery
      required:
        - appRepoUrl
        - appPath
      properties:
        appRepoUrl:
          title: Application repository
          type: string
          description: Repository containing the Kubernetes manifests or Kustomize overlay.
          default: github.com?owner=Azure-Samples&repo=aks-store-demo
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        appPath:
          title: Manifest path
          type: string
          description: Path inside the application repository for ArgoCD to sync.
          default: kustomize/overlays/dev
        targetRevision:
          title: Target revision
          type: string
          description: Branch, tag, or commit for ArgoCD to sync.
          default: HEAD

    - title: GitOps repository pull request
      backstage:permissions:
        tags:
          - kind-delivery
      required:
        - argoRepoUrl
        - pullRequestTitle
        - commitMessage
      properties:
        argoRepoUrl:
          title: GitOps repository
          type: string
          description: Repository watched by control-plane ArgoCD.
          default: github.com?owner=zhangchl007&repo=aks-platform-engineering
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        pullRequestTitle:
          title: Pull request title
          type: string
          default: Add Arc kind application GitOps definition
        commitMessage:
          title: Commit message
          type: string
          default: Add Arc kind application GitOps definition

  steps:
    - id: fetch-repo
      name: Fetch GitOps repository
      action: fetch:plain
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        url: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}.git
        targetPath: ./gitops-repo

    - id: render-app-gitops
      name: Render Arc/kind application GitOps files
      action: fetch:template
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        url: ./content
        targetPath: ./gitops-repo
        values:
          name: ${{ parameters.name }}
          targetEnvironment: ${{ parameters.targetEnvironment }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}
          appRepoUrl: https://${{ (parameters.appRepoUrl | parseRepoUrl).host }}/${{ (parameters.appRepoUrl | parseRepoUrl).owner }}/${{ (parameters.appRepoUrl | parseRepoUrl).repo }}.git
          appPath: ${{ parameters.appPath }}
          targetRevision: ${{ parameters.targetRevision }}

    - id: rename-app-folder
      name: Name application GitOps folder
      action: fs:rename
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        files:
          - from: ./gitops-repo/gitops/apps/myapp
            to: ./gitops-repo/gitops/apps/${{ parameters.name }}
          - from: ./gitops-repo/gitops/apps/${{ parameters.name }}/petArgoApp.yaml
            to: ./gitops-repo/gitops/apps/${{ parameters.name }}/${{ parameters.name }}-argocd-app.yaml

    - id: publish-pr
      name: Create GitOps pull request
      action: publish:github:pull-request
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        title: ${{ parameters.pullRequestTitle }}
        description: |
          Backstage request to deploy Arc/kind application `${{ parameters.name }}`.

          This pull request adds an ArgoCD Application limited to
          `kind-team-delivery` and the approved `group1-apps` namespace.
        repoUrl: ${{ parameters.argoRepoUrl }}
        commitMessage: ${{ parameters.commitMessage }}
        sourcePath: ./gitops-repo
        branchName: backstage/kind/${{ parameters.name }}
        update: true

    - id: register
      name: Register catalog component
      action: catalog:register
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        repoContentsUrl: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}
        catalogInfoPath: /blob/backstage/${{ parameters.name }}/catalog-info.yaml
        optional: true

  output:
    links:
      - title: Pull request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
      - title: ArgoCD application manifest
        icon: catalog
        url: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}/tree/backstage/kind/${{ parameters.name }}/gitops/apps/${{ parameters.name }}/${{ parameters.name }}-argocd-app.yaml
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
