apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ${{ values.name }}
  namespace: argocd
  annotations:
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  project: kind-team-delivery
  source:
    repoURL: ${{ values.appRepoUrl }}
    targetRevision: ${{ values.targetRevision }}
    path: ${{ values.appPath }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  destination:
    namespace: group1-apps
    name: {% if values.targetEnvironment == "kind-arc-demo-vm-group1" %}arc-demo-vm{% else %}arc-demo-vm-2{% endif %}
