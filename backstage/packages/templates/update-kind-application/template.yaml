apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: update-kind-application
  title: Update Arc Kind Application with ArgoCD
  description: Create a GitOps pull request to update an existing Arc/kind ArgoCD ApplicationSet.
  tags:
    - application
    - argocd
    - gitops
    - kubernetes
    - kind
    - arc
    - kind-delivery
  annotations:
    platform-access.akspe.io/allowed-groups: k8sadmin,akspe-kind-cluster-deployers
    platform-access.akspe.io/protected: "true"
    platform-access.akspe.io/allow-kind-deployers: "true"
spec:
  owner: group:default/k8sadmin
  type: service

  parameters:
    - title: Existing application
      backstage:permissions:
        tags:
          - kind-delivery
      required:
        - name
        - targetEnvironment
      properties:
        name:
          title: Existing application name
          type: string
          description: Existing Backstage-delivered Arc/kind ApplicationSet name.
          default: kind-store-demo
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        targetEnvironment:
          title: Approved Arc/kind deployment target
          type: string
          description: Keep the application on the approved Arc/kind multi-cluster delivery destination.
          default: kind-arc-demo-vms-group1
          enum:
            - kind-arc-demo-vms-group1
          enumNames:
            - Arc kind multi-cluster - approved labeled clusters / group1-apps

    - title: Updated application source
      backstage:permissions:
        tags:
          - kind-delivery
      required:
        - appRepoUrl
        - appPath
      properties:
        appRepoUrl:
          title: Application repository
          type: string
          description: Repository containing the Kubernetes manifests or Kustomize overlay.
          default: github.com?owner=zhangchl007&repo=aks-platform-engineering
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        appPath:
          title: Manifest path
          type: string
          description: Path inside the application repository for ArgoCD to sync.
          default: gitops/apps/platform-demo/kind
        targetRevision:
          title: Target revision
          type: string
          description: Branch, tag, or commit for ArgoCD to sync.
          default: zhangchl007-arc-multi-cluster-access

    - title: GitOps repository pull request
      backstage:permissions:
        tags:
          - kind-delivery
      required:
        - argoRepoUrl
        - pullRequestTitle
        - commitMessage
      properties:
        argoRepoUrl:
          title: GitOps repository
          type: string
          description: Repository watched by control-plane ArgoCD.
          default: github.com?owner=zhangchl007&repo=aks-platform-engineering
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        pullRequestTitle:
          title: Pull request title
          type: string
          default: Update Arc kind application GitOps definition
        commitMessage:
          title: Commit message
          type: string
          default: Update Arc kind application GitOps definition
        targetBranchName:
          title: GitOps target branch
          type: string
          description: Branch watched by the control-plane ArgoCD instance.
          default: zhangchl007-arc-multi-cluster-access

  steps:
    - id: fetch-repo
      name: Fetch GitOps repository
      action: fetch:plain
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        url: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}/tree/${{ parameters.targetBranchName }}
        targetPath: ./gitops-repo

    - id: render-update
      name: Render updated Arc/kind ApplicationSet manifest
      action: fetch:template
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        url: ./content
        targetPath: ./rendered-update
        values:
          name: ${{ parameters.name }}
          targetEnvironment: ${{ parameters.targetEnvironment }}
          requesterEntityRef: ${{ user.ref }}
          deliveryPersona: kind
          appRepoUrl: https://${{ (parameters.appRepoUrl | parseRepoUrl).host }}/${{ (parameters.appRepoUrl | parseRepoUrl).owner }}/${{ (parameters.appRepoUrl | parseRepoUrl).repo }}.git
          appPath: ${{ parameters.appPath }}
          targetRevision: ${{ parameters.targetRevision }}

    - id: replace-application
      name: Replace existing ArgoCD ApplicationSet file
      action: platform:replace-delivered-application-manifest
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        name: ${{ parameters.name }}
        sourcePath: ./rendered-update/application-set.yaml
        manifestKind: applicationset

    - id: publish-pr
      name: Create GitOps update pull request
      action: publish:github:pull-request
      backstage:permissions:
        tags:
          - kind-delivery
      input:
        title: ${{ parameters.pullRequestTitle }}
        description: |
          Backstage request to update Arc/kind application `${{ parameters.name }}`.

          This pull request updates the existing ArgoCD ApplicationSet under
          `gitops/apps/backstage-delivery/${{ parameters.name }}`. ArgoCD remains
          the only component that applies the Kubernetes change after merge.
        repoUrl: ${{ parameters.argoRepoUrl }}
        commitMessage: ${{ parameters.commitMessage }}
        sourcePath: ./gitops-repo
        branchName: backstage/kind/${{ parameters.name }}-update
        targetBranchName: ${{ parameters.targetBranchName }}
        update: true

  output:
    links:
      - title: Pull request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
      - title: Updated ArgoCD ApplicationSet manifest
        icon: catalog
        url: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}/tree/backstage/kind/${{ parameters.name }}-update/gitops/apps/backstage-delivery/${{ parameters.name }}/${{ parameters.name }}-applicationset.yaml
