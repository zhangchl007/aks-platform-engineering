apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: update-aks-application
  title: Update AKS Application with ArgoCD
  description: Create a GitOps pull request to update an existing AKS ArgoCD Application.
  tags:
    - application
    - argocd
    - gitops
    - kubernetes
    - aks
    - aks-delivery
  annotations:
    platform-access.akspe.io/allowed-groups: k8sadmin,akspe-aks-cluster-deployers
    platform-access.akspe.io/protected: "true"
    platform-access.akspe.io/allow-aks-deployers: "true"
spec:
  owner: group:default/k8sadmin
  type: service

  parameters:
    - title: Existing application
      backstage:permissions:
        tags:
          - aks-delivery
      required:
        - name
        - targetEnvironment
      properties:
        name:
          title: Existing application name
          type: string
          description: Existing Backstage-delivered ArgoCD Application name from gitops/apps/backstage-delivery on the watched branch.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
          ui:placeholder: aks-store-demo
        targetEnvironment:
          title: Approved AKS deployment target
          type: string
          description: AKS deployment target approved by the platform AppProject.
          default: aks-gitops-aks-group2
          enum:
            - aks-gitops-aks-group2
          enumNames:
            - AKS - gitops-aks / group2-aks-apps

    - title: Updated application source
      backstage:permissions:
        tags:
          - aks-delivery
      required:
        - appRepoUrl
        - appPath
      properties:
        appRepoUrl:
          title: Application repository
          type: string
          description: Repository containing the Kubernetes manifests or Kustomize overlay.
          default: github.com?owner=zhangchl007&repo=aks-platform-engineering
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        appPath:
          title: Manifest path
          type: string
          description: Path inside the application repository for ArgoCD to sync.
          default: gitops/apps/platform-demo/aks
        targetRevision:
          title: Target revision
          type: string
          description: Branch, tag, or commit for ArgoCD to sync.
          default: zhangchl007-arc-multi-cluster-access

    - title: GitOps repository pull request
      backstage:permissions:
        tags:
          - aks-delivery
      required:
        - argoRepoUrl
        - pullRequestTitle
        - commitMessage
      properties:
        argoRepoUrl:
          title: GitOps repository
          type: string
          description: Repository watched by control-plane ArgoCD.
          default: github.com?owner=zhangchl007&repo=aks-platform-engineering
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        pullRequestTitle:
          title: Pull request title
          type: string
          default: Update AKS application GitOps definition
        commitMessage:
          title: Commit message
          type: string
          default: Update AKS application GitOps definition
        targetBranchName:
          title: GitOps target branch
          type: string
          description: Branch watched by the control-plane ArgoCD instance.
          default: zhangchl007-arc-multi-cluster-access

  steps:
    - id: fetch-repo
      name: Fetch GitOps repository
      action: fetch:plain
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        url: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}/tree/${{ parameters.targetBranchName }}
        targetPath: ./gitops-repo

    - id: render-update
      name: Render updated AKS application manifest
      action: fetch:template
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        url: ./content
        targetPath: ./rendered-update
        values:
          name: ${{ parameters.name }}
          targetEnvironment: ${{ parameters.targetEnvironment }}
          requesterEntityRef: ${{ user.ref }}
          deliveryPersona: aks
          appRepoUrl: https://${{ (parameters.appRepoUrl | parseRepoUrl).host }}/${{ (parameters.appRepoUrl | parseRepoUrl).owner }}/${{ (parameters.appRepoUrl | parseRepoUrl).repo }}.git
          appPath: ${{ parameters.appPath }}
          targetRevision: ${{ parameters.targetRevision }}

    - id: replace-application
      name: Replace existing ArgoCD Application file
      action: platform:replace-delivered-application-manifest
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        name: ${{ parameters.name }}
        sourcePath: ./rendered-update/app.yaml
        manifestKind: application

    - id: publish-pr
      name: Create GitOps update pull request
      action: publish:github:pull-request
      backstage:permissions:
        tags:
          - aks-delivery
      input:
        title: ${{ parameters.pullRequestTitle }}
        description: |
          Backstage request to update AKS application `${{ parameters.name }}`.

          This pull request updates the existing ArgoCD Application under
          `gitops/apps/backstage-delivery/${{ parameters.name }}`. ArgoCD remains
          the only component that applies the Kubernetes change after merge.
        repoUrl: ${{ parameters.argoRepoUrl }}
        commitMessage: ${{ parameters.commitMessage }}
        sourcePath: ./gitops-repo
        branchName: backstage/aks/${{ parameters.name }}-update
        targetBranchName: ${{ parameters.targetBranchName }}
        update: true

  output:
    links:
      - title: Pull request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
      - title: Updated ArgoCD application manifest
        icon: catalog
        url: https://${{ (parameters.argoRepoUrl | parseRepoUrl).host }}/${{ (parameters.argoRepoUrl | parseRepoUrl).owner }}/${{ (parameters.argoRepoUrl | parseRepoUrl).repo }}/tree/backstage/aks/${{ parameters.name }}-update/gitops/apps/backstage-delivery/${{ parameters.name }}/${{ parameters.name }}-argocd-app.yaml
