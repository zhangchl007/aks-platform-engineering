# Default values for backstagechart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
namespace: backstage
env:
  AZURE_TENANT_ID: "your-tenant-id"
  AZURE_CLIENT_ID: "your-client-id"
  AZURE_CLIENT_SECRET: "your-client-secret"
  GITHUB_CLIENT_ID: "your-github-oauth-client-id"
  GITHUB_CLIENT_SECRET: "your-github-oauth-client-secret"
  POSTGRES_HOST: "your-postgres-host"
  POSTGRES_PORT: "your-postgres-port"
  POSTGRES_USER: "your-postgres-user"
  POSTGRES_PASSWORD: "your-postgres-password"
  POSTGRES_DB: "your-postgres-db"
  BASE_URL: "http://your-public-ip"
  K8S_CLUSTER_NAME: "your-cluster-name"
  # Backstage runs in the control-plane cluster, so its default API endpoint is
  # the in-cluster Kubernetes service. A private multi-cluster Secret can
  # override this legacy single-cluster fallback.
  K8S_CLUSTER_URL: "https://kubernetes.default.svc"
  K8S_SERVICE_ACCOUNT_TOKEN: "token"
  GITHUB_TOKEN: "token"
  GITOPS_REPO: "https://github.com/Azure-Samples/platform-engineering"
  BACKSTAGE_CATALOG_URL: "https://github.com/zhangchl007/aks-platform-engineering/blob/main/backstage/catalog/catalog-info.yaml"
  # These no-match defaults prevent broad Graph directory ingestion until the
  # platform identity convergence flow supplies approved Entra group IDs.
  BACKSTAGE_GRAPH_GROUP_FILTER: "id eq '00000000-0000-0000-0000-000000000000'"
  BACKSTAGE_GRAPH_USER_GROUP_FILTER: "id eq '00000000-0000-0000-0000-000000000000'"
  BACKSTAGE_ENTRA_GROUP_MAPPINGS: "{}"
  BACKSTAGE_ADMIN_GROUP_IDS: ""
  BACKSTAGE_ADMIN_GROUP_ENTITY_NAMES: "k8sadmin"

# The secret is created outside Helm by scripts/configure-backstage-kubernetes-connections.ps1.
# It contains only the private, read-only Kubernetes connection configuration.
kubernetesClusters:
  secretName: ""
  configKey: "kubernetes-clusters.yaml"

runtimeSecret:
  # Secrets remain outside Git. ArgoCD owns the workload that consumes this
  # Secret; its values are provisioned through the documented bootstrap path.
  name: ""

identitySecret:
  # Entra group IDs and Graph filters are generated by the platform access
  # bootstrap and consumed declaratively by the ArgoCD-managed workload.
  name: ""
  


replicaCount: 1

image:
  repository: <oowcontainerimages.azurecr.io/backstage>
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: <tag>

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: 
  backstage.io/kubernetes-id: <cluster-name-component>

labels:
  kubernetesId: <your-cluster-name-component>

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: LoadBalancer
  port: 80
  targetPort: 7007
  annotations: 
    service.beta.kubernetes.io/azure-load-balancer-ipv4: <your-ipv4-address>
    service.beta.kubernetes.io/azure-load-balancer-resource-group: <your-resource-group>

deployment:
  port: 7007

ingress:
  enabled: false
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: "example.domain.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: backstage-tls
      hosts:
        - "example.domain.com"


resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
