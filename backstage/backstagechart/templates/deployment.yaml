apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backstagechart.fullname" . }}
  namespace: {{ .Values.namespace }} 
  labels:
    {{- include "backstagechart.labels" . | nindent 4 }}
    backstage.io/kubernetes-id: {{ .Values.labels.kubernetesId }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "backstagechart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "backstagechart.selectorLabels" . | nindent 8 }}
        backstage.io/kubernetes-id: {{ .Values.labels.kubernetesId }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: backstage-service-account
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.kubernetesClusters.secretName }}
          command: ["node", "packages/backend"]
          args:
            - --config
            - app-config.yaml
            - --config
            - /etc/backstage/kubernetes/{{ .Values.kubernetesClusters.configKey }}
          {{- end }}
          env:
          {{- if not .Values.runtimeSecret.name }}
           - name: AZURE_TENANT_ID
              value: {{ .Values.env.AZURE_TENANT_ID | quote }}
            - name: AZURE_CLIENT_ID
              value: {{ .Values.env.AZURE_CLIENT_ID | quote }}
            - name: AZURE_CLIENT_SECRET
              value: {{ .Values.env.AZURE_CLIENT_SECRET | quote }}
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.env.GITHUB_CLIENT_ID | quote }}
            - name: GITHUB_CLIENT_SECRET
              value: {{ .Values.env.GITHUB_CLIENT_SECRET | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.env.POSTGRES_HOST | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.env.POSTGRES_PORT | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.env.POSTGRES_USER | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.env.POSTGRES_PASSWORD | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.env.POSTGRES_DB | quote }}
            - name: BASE_URL
              value: {{ .Values.env.BASE_URL | quote }}
            - name: K8S_CLUSTER_NAME
              value: {{ .Values.env.K8S_CLUSTER_NAME | quote }}
            - name: K8S_CLUSTER_URL 
              value: {{ .Values.env.K8S_CLUSTER_URL | quote }}
            - name: K8S_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.env.K8S_SERVICE_ACCOUNT_TOKEN | quote }}
            - name: GITHUB_TOKEN
              value: {{ .Values.env.GITHUB_TOKEN | quote }}
            - name: GITOPS_REPO
              value: {{ .Values.env.GITOPS_REPO | quote }}
          {{- end }}
            - name: BACKSTAGE_CATALOG_URL
              value: {{ .Values.env.BACKSTAGE_CATALOG_URL | quote }}
          {{- if .Values.identitySecret.name }}
            - name: BACKSTAGE_ALLOWED_GROUP_IDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identitySecret.name | quote }}
                  key: backstage_sso_group_object_id
            - name: BACKSTAGE_GRAPH_GROUP_FILTER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identitySecret.name | quote }}
                  key: backstage_graph_group_filter
            - name: BACKSTAGE_GRAPH_USER_GROUP_FILTER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identitySecret.name | quote }}
                  key: backstage_graph_user_group_filter
            - name: BACKSTAGE_ENTRA_GROUP_MAPPINGS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.identitySecret.name | quote }}
                  key: backstage_entra_group_mappings
          {{- else }}
            - name: BACKSTAGE_GRAPH_GROUP_FILTER
              value: {{ .Values.env.BACKSTAGE_GRAPH_GROUP_FILTER | quote }}
            - name: BACKSTAGE_GRAPH_USER_GROUP_FILTER
              value: {{ .Values.env.BACKSTAGE_GRAPH_USER_GROUP_FILTER | quote }}
            - name: BACKSTAGE_ENTRA_GROUP_MAPPINGS
              value: {{ .Values.env.BACKSTAGE_ENTRA_GROUP_MAPPINGS | quote }}
          {{- end }}
          {{- if .Values.runtimeSecret.name }}
          envFrom:
            - secretRef:
                name: {{ .Values.runtimeSecret.name | quote }}
          {{- end }}

          ports:
            - name: http
              containerPort: {{ .Values.deployment.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 7007
              scheme: HTTPS
          readinessProbe:
            httpGet:
              path: /
              port: 7007
              scheme: HTTPS
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tls-volume
              mountPath: /etc/tls
              readOnly: true
            {{- if .Values.kubernetesClusters.secretName }}
            - name: kubernetes-clusters
              mountPath: /etc/backstage/kubernetes
              readOnly: true
            {{- end }}
      volumes:
        - name: tls-volume
          secret:
            secretName: my-tls-secret
        {{- if .Values.kubernetesClusters.secretName }}
        - name: kubernetes-clusters
          secret:
            secretName: {{ .Values.kubernetesClusters.secretName | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
