apiVersion: v1
kind: Namespace
metadata:
  name: portal-demo
  labels:
    access-model: azure-portal-arc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal-demo-editor
  namespace: portal-demo
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "pods/log", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal-demo-users-edit
  namespace: portal-demo
subjects:
  - kind: Group
    name: portal-demo-users
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: portal-demo-editor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-demo-config
  namespace: portal-demo
data:
  APP_MESSAGE: "Hello from Azure Portal and Azure Arc"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: portal-demo-secret
  namespace: portal-demo
type: Opaque
stringData:
  SAMPLE_PASSWORD: "replace-with-key-vault-or-external-secrets"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-demo-web
  namespace: portal-demo
  labels:
    app: portal-demo-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal-demo-web
  template:
    metadata:
      labels:
        app: portal-demo-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: portal-demo-config
          env:
            - name: SAMPLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-demo-secret
                  key: SAMPLE_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: portal-demo-web
  namespace: portal-demo
spec:
  type: ClusterIP
  selector:
    app: portal-demo-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: portal-demo-stateful
  namespace: portal-demo
spec:
  clusterIP: None
  selector:
    app: portal-demo-stateful
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portal-demo-stateful
  namespace: portal-demo
  labels:
    app: portal-demo-stateful
spec:
  serviceName: portal-demo-stateful
  replicas: 1
  selector:
    matchLabels:
      app: portal-demo-stateful
  template:
    metadata:
      labels:
        app: portal-demo-stateful
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: cache
              mountPath: /usr/share/nginx/html/cache
      volumes:
        - name: cache
          emptyDir: {}
