apiVersion: batch/v1
kind: Job
metadata:
  name: devtron-platform-access-converge
  namespace: devtroncd
  labels:
    app.kubernetes.io/name: devtron-platform-access-converge
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devtron-platform-access-converge
    spec:
      restartPolicy: Never
      containers:
        - name: converge
          image: quay.io/devtron/postgres:14.9
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: postgresql-postgresql.devtroncd.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgresql-postgresql
                  key: POSTGRES_USER
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgresql-postgresql
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-postgresql
                  key: postgresql-password
            - name: K8SADMIN_GROUP_OBJECT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-access-groups
                  key: k8sadmin_group_object_id
            - name: KIND_DEPLOYER_GROUP_OBJECT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-access-groups
                  key: kind_deployer_group_object_id
            - name: AKS_DEPLOYER_GROUP_OBJECT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-access-groups
                  key: aks_deployer_group_object_id
            - name: KIND_CLUSTER_NAMES
              valueFrom:
                configMapKeyRef:
                  name: platform-access-policy
                  key: kind_cluster_names
            - name: KIND_DEPLOY_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: platform-access-policy
                  key: kind_deploy_namespace
            - name: KIND_DEVTRON_APP_ROLES
              valueFrom:
                configMapKeyRef:
                  name: platform-access-policy
                  key: kind_devtron_app_roles
            - name: AKS_CLUSTER_NAMES
              valueFrom:
                configMapKeyRef:
                  name: platform-access-policy
                  key: aks_cluster_names
            - name: AKS_DEPLOY_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: platform-access-policy
                  key: aks_deploy_namespace
            - name: AKS_DEVTRON_APP_ROLES
              valueFrom:
                configMapKeyRef:
                  name: platform-access-policy
                  key: aks_devtron_app_roles
          command:
            - /bin/sh
            - -ec
            - |
              cat <<SQL >/tmp/converge.sql
              DO \$\$
              DECLARE
                k8sadmin_id text := '$K8SADMIN_GROUP_OBJECT_ID';
                kind_id text := '$KIND_DEPLOYER_GROUP_OBJECT_ID';
                aks_id text := '$AKS_DEPLOYER_GROUP_OBJECT_ID';
                super_role_id integer;
                rg_id integer;
                role_name text;
                target_cluster_name text;
                default_cluster_id integer;
                gitops_cluster_id integer;
                cluster_ref record;
                kind_clusters text[] := regexp_split_to_array('$KIND_CLUSTER_NAMES', '\s*,\s*');
                aks_clusters text[] := regexp_split_to_array('$AKS_CLUSTER_NAMES', '\s*,\s*');
                kind_app_roles text[] := regexp_split_to_array('$KIND_DEVTRON_APP_ROLES', '\s*,\s*');
                aks_app_roles text[] := regexp_split_to_array('$AKS_DEVTRON_APP_ROLES', '\s*,\s*');
                kind_namespace text := '$KIND_DEPLOY_NAMESPACE';
                aks_namespace text := '$AKS_DEPLOY_NAMESPACE';
              BEGIN
                SELECT id INTO default_cluster_id FROM cluster WHERE cluster_name = 'default_cluster' LIMIT 1;
                SELECT id INTO gitops_cluster_id FROM cluster WHERE cluster_name = 'gitops-aks' LIMIT 1;

                IF default_cluster_id IS NOT NULL AND gitops_cluster_id IS NOT NULL AND default_cluster_id <> gitops_cluster_id THEN
                  FOR cluster_ref IN
                    SELECT table_schema, table_name
                    FROM information_schema.columns
                    WHERE table_schema = 'public'
                      AND column_name = 'cluster_id'
                  LOOP
                    EXECUTE format('UPDATE %I.%I SET cluster_id = \$1 WHERE cluster_id = \$2', cluster_ref.table_schema, cluster_ref.table_name)
                      USING default_cluster_id, gitops_cluster_id;
                  END LOOP;

                  DELETE FROM cluster WHERE id = gitops_cluster_id;
                  UPDATE cluster
                  SET cluster_name = 'gitops-aks',
                      updated_by = 1,
                      updated_on = now()
                  WHERE id = default_cluster_id;
                ELSIF default_cluster_id IS NOT NULL AND gitops_cluster_id IS NULL THEN
                  UPDATE cluster
                  SET cluster_name = 'gitops-aks',
                      updated_by = 1,
                      updated_on = now()
                  WHERE id = default_cluster_id;
                END IF;

                SELECT id INTO super_role_id FROM roles WHERE role = 'role:super-admin___' LIMIT 1;
                IF super_role_id IS NULL THEN
                  RAISE EXCEPTION 'Devtron super-admin role not found';
                END IF;

                SELECT id INTO rg_id FROM role_group WHERE name = k8sadmin_id OR casbin_name = 'group:' || k8sadmin_id LIMIT 1;
                IF rg_id IS NULL THEN
                  INSERT INTO role_group (name, casbin_name, description, created_by, updated_by, created_on, updated_on, active)
                  VALUES (k8sadmin_id, 'group:' || k8sadmin_id, 'k8sadmin: Devtron platform administrator group', 1, 1, now(), now(), true)
                  RETURNING id INTO rg_id;
                ELSE
                  UPDATE role_group
                  SET name = k8sadmin_id,
                      casbin_name = 'group:' || k8sadmin_id,
                      description = 'k8sadmin: Devtron platform administrator group',
                      active = true,
                      updated_by = 1,
                      updated_on = now()
                  WHERE id = rg_id;
                END IF;

                IF NOT EXISTS (SELECT 1 FROM role_group_role_mapping WHERE role_group_id = rg_id AND role_id = super_role_id) THEN
                  INSERT INTO role_group_role_mapping (role_group_id, role_id, created_by, updated_by, created_on, updated_on)
                  VALUES (rg_id, super_role_id, 1, 1, now(), now());
                END IF;

                SELECT id INTO rg_id FROM role_group WHERE name = kind_id OR casbin_name = 'group:' || kind_id LIMIT 1;
                IF rg_id IS NULL THEN
                  INSERT INTO role_group (name, casbin_name, description, created_by, updated_by, created_on, updated_on, active)
                  VALUES (kind_id, 'group:' || kind_id, 'akspe-kind-cluster-deployers: Devtron deploy access to group1 kind environments only', 1, 1, now(), now(), true)
                  RETURNING id INTO rg_id;
                ELSE
                  UPDATE role_group
                  SET name = kind_id,
                      casbin_name = 'group:' || kind_id,
                      description = 'akspe-kind-cluster-deployers: Devtron deploy access to group1 kind environments only',
                      active = true,
                      updated_by = 1,
                      updated_on = now()
                  WHERE id = rg_id;
                END IF;

                FOREACH role_name IN ARRAY kind_app_roles LOOP
                  INSERT INTO role_group_role_mapping (role_group_id, role_id, created_by, updated_by, created_on, updated_on)
                  SELECT rg_id, r.id, 1, 1, now(), now()
                  FROM roles r
                  WHERE r.role = role_name
                    AND NOT EXISTS (
                      SELECT 1 FROM role_group_role_mapping m
                      WHERE m.role_group_id = rg_id AND m.role_id = r.id
                    );
                END LOOP;

                FOREACH target_cluster_name IN ARRAY kind_clusters LOOP
                  role_name := format('role:clusterView_%s_%s_*_*_*', target_cluster_name, kind_namespace);
                  INSERT INTO role_group_role_mapping (role_group_id, role_id, created_by, updated_by, created_on, updated_on)
                  SELECT rg_id, r.id, 1, 1, now(), now()
                  FROM roles r
                  WHERE r.role = role_name
                    AND NOT EXISTS (
                      SELECT 1 FROM role_group_role_mapping m
                      WHERE m.role_group_id = rg_id AND m.role_id = r.id
                    );
                END LOOP;

                SELECT id INTO rg_id FROM role_group WHERE name = aks_id OR casbin_name = 'group:' || aks_id LIMIT 1;
                IF rg_id IS NULL THEN
                  INSERT INTO role_group (name, casbin_name, description, created_by, updated_by, created_on, updated_on, active)
                  VALUES (aks_id, 'group:' || aks_id, 'akspe-aks-cluster-deployers: Devtron deploy access to group2 AKS environment only', 1, 1, now(), now(), true)
                  RETURNING id INTO rg_id;
                ELSE
                  UPDATE role_group
                  SET name = aks_id,
                      casbin_name = 'group:' || aks_id,
                      description = 'akspe-aks-cluster-deployers: Devtron deploy access to group2 AKS environment only',
                      active = true,
                      updated_by = 1,
                      updated_on = now()
                  WHERE id = rg_id;
                END IF;

                FOREACH role_name IN ARRAY aks_app_roles LOOP
                  INSERT INTO role_group_role_mapping (role_group_id, role_id, created_by, updated_by, created_on, updated_on)
                  SELECT rg_id, r.id, 1, 1, now(), now()
                  FROM roles r
                  WHERE r.role = role_name
                    AND NOT EXISTS (
                      SELECT 1 FROM role_group_role_mapping m
                      WHERE m.role_group_id = rg_id AND m.role_id = r.id
                    );
                END LOOP;

                FOREACH target_cluster_name IN ARRAY aks_clusters LOOP
                  role_name := format('role:clusterView_%s_%s_*_*_*', target_cluster_name, aks_namespace);
                  INSERT INTO role_group_role_mapping (role_group_id, role_id, created_by, updated_by, created_on, updated_on)
                  SELECT rg_id, r.id, 1, 1, now(), now()
                  FROM roles r
                  WHERE r.role = role_name
                    AND NOT EXISTS (
                      SELECT 1 FROM role_group_role_mapping m
                      WHERE m.role_group_id = rg_id AND m.role_id = r.id
                    );
                END LOOP;
              END
              \$\$;
              SQL

              psql -v ON_ERROR_STOP=1 -f /tmp/converge.sql
