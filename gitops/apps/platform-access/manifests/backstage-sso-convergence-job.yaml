apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-sso-converge
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-sso-converge
    app.kubernetes.io/managed-by: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-sso-converge
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-sso-converge
    app.kubernetes.io/managed-by: argocd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-sso-converge
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-sso-converge
    app.kubernetes.io/managed-by: argocd
subjects:
  - kind: ServiceAccount
    name: backstage-sso-converge
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-sso-converge
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-sso-converge
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-sso-converge
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage-sso-converge
    spec:
      serviceAccountName: backstage-sso-converge
      restartPolicy: Never
      containers:
        - name: kubectl
          image: docker.io/bitnami/kubectl:1.30
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKSTAGE_DEPLOYMENT
              value: backstage-backstagechart
            - name: BACKSTAGE_SSO_GROUP_OBJECT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-backstage-sso
                  key: backstage_sso_group_object_id
          command:
            - /bin/sh
            - -ec
            - |
              kubectl -n backstage set env deployment/${BACKSTAGE_DEPLOYMENT} \
                BACKSTAGE_ALLOWED_GROUP_IDS=${BACKSTAGE_SSO_GROUP_OBJECT_ID}
