apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-sso-converge
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-sso-converge
    app.kubernetes.io/managed-by: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-sso-converge
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-sso-converge
    app.kubernetes.io/managed-by: argocd
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-sso-converge
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-sso-converge
    app.kubernetes.io/managed-by: argocd
subjects:
  - kind: ServiceAccount
    name: backstage-sso-converge
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-sso-converge
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-sso-converge
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage-sso-converge
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage-sso-converge
    spec:
      serviceAccountName: backstage-sso-converge
      restartPolicy: Never
      containers:
        - name: converge
          image: ancientsword.azurecr.io/backstage:customer-demo-sso
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BACKSTAGE_DEPLOYMENT
              value: backstage-backstagechart
            - name: BACKSTAGE_SSO_GROUP_OBJECT_ID
              valueFrom:
                secretKeyRef:
                  name: platform-backstage-sso
                  key: backstage_sso_group_object_id
            - name: BACKSTAGE_ENTRA_GROUP_MAPPINGS
              valueFrom:
                secretKeyRef:
                  name: platform-backstage-sso
                  key: backstage_entra_group_mappings
            - name: BACKSTAGE_GRAPH_GROUP_FILTER
              valueFrom:
                secretKeyRef:
                  name: platform-backstage-sso
                  key: backstage_graph_group_filter
            - name: BACKSTAGE_GRAPH_USER_GROUP_FILTER
              valueFrom:
                secretKeyRef:
                  name: platform-backstage-sso
                  key: backstage_graph_user_group_filter
          command:
            - node
            - -e
            - |
              const fs = require('fs');
              const https = require('https');

              const namespace = process.env.POD_NAMESPACE || 'backstage';
              const deployment = process.env.BACKSTAGE_DEPLOYMENT;
              const {
                BACKSTAGE_SSO_GROUP_OBJECT_ID: backstageGroupId,
                BACKSTAGE_ENTRA_GROUP_MAPPINGS: groupMappings,
                BACKSTAGE_GRAPH_GROUP_FILTER: graphGroupFilter,
                BACKSTAGE_GRAPH_USER_GROUP_FILTER: graphUserGroupFilter,
              } = process.env;
              if (!deployment || !backstageGroupId || !groupMappings || !graphGroupFilter || !graphUserGroupFilter) {
                throw new Error('Backstage SSO and Microsoft Graph identity settings are required.');
              }

              const token = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/token', 'utf8');
              const ca = fs.readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt');
              const patch = JSON.stringify({
                spec: {
                  template: {
                    spec: {
                      containers: [{
                        name: 'backstagechart',
                        env: [
                          {
                            name: 'BACKSTAGE_ALLOWED_GROUP_IDS',
                            value: backstageGroupId,
                          },
                          {
                            name: 'BACKSTAGE_ENTRA_GROUP_MAPPINGS',
                            value: groupMappings,
                          },
                          {
                            name: 'BACKSTAGE_GRAPH_GROUP_FILTER',
                            value: graphGroupFilter,
                          },
                          {
                            name: 'BACKSTAGE_GRAPH_USER_GROUP_FILTER',
                            value: graphUserGroupFilter,
                          },
                        ],
                      }],
                    },
                  },
                },
              });

              const request = https.request({
                hostname: 'kubernetes.default.svc',
                port: 443,
                path: `/apis/apps/v1/namespaces/${namespace}/deployments/${deployment}`,
                method: 'PATCH',
                ca,
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/strategic-merge-patch+json',
                  'Content-Length': Buffer.byteLength(patch),
                },
              }, response => {
                let body = '';
                response.on('data', chunk => { body += chunk; });
                response.on('end', () => {
                  if (response.statusCode < 200 || response.statusCode >= 300) {
                    console.error(body);
                    process.exit(1);
                  }
                  console.log(`Backstage ${deployment} now converges common SSO and Microsoft Graph group configuration.`);
                });
              });

              request.on('error', error => {
                console.error(error);
                process.exit(1);
              });
              request.write(patch);
              request.end();
