apiVersion: v1
kind: Service
metadata:
  name: devtron-internal
  namespace: devtroncd
  labels:
    app.kubernetes.io/managed-by: akspe-devtron-poc
    app.kubernetes.io/name: devtron-internal
spec:
  type: ClusterIP
  selector:
    app: devtron
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: devtron
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devtron-https-nginx
  namespace: devtroncd
  labels:
    app.kubernetes.io/managed-by: akspe-devtron-poc
    app.kubernetes.io/name: devtron-https-proxy
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;

    events {
      worker_connections 1024;
    }

    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
          proxy_pass http://devtron-internal.devtroncd.svc.cluster.local;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Port 443;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtron-https-proxy
  namespace: devtroncd
  labels:
    app: devtron-https-proxy
    app.kubernetes.io/managed-by: akspe-devtron-poc
    app.kubernetes.io/name: devtron-https-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devtron-https-proxy
  template:
    metadata:
      labels:
        app: devtron-https-proxy
        app.kubernetes.io/name: devtron-https-proxy
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /dashboard/
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /dashboard/
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: devtron-https-nginx
        - name: tls
          secret:
            secretName: devtron-https-tls
---
apiVersion: v1
kind: Service
metadata:
  name: devtron-service
  namespace: devtroncd
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app: devtron-https-proxy
    app.kubernetes.io/managed-by: akspe-devtron-poc
    release: devtron
spec:
  type: LoadBalancer
  selector:
    app: devtron-https-proxy
  ports:
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
