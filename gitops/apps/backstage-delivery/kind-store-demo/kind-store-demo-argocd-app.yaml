apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kind-store-demo
  namespace: argocd
  annotations:
    backstage.io/kubernetes-id: kind-store-demo
spec:
  project: kind-team-delivery
  source:
    repoURL: https://github.com/zhangchl007/aks-platform-engineering
    targetRevision: zhangchl007-arc-multi-cluster-access
    path: gitops/apps/platform-demo/kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  destination:
    namespace: group1-apps
    name: arc-demo-vm
