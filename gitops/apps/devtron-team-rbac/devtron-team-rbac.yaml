apiVersion: v1
kind: Namespace
metadata:
  name: team-a-dev
  labels:
    app.kubernetes.io/managed-by: akspe-devtron-poc
    devtron.dev/project: team-a
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devtron-team-a-deployer
  namespace: team-a-dev
  labels:
    app.kubernetes.io/managed-by: akspe-devtron-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devtron-team-a-deployer
  namespace: team-a-dev
  labels:
    app.kubernetes.io/managed-by: akspe-devtron-poc
rules:
  - apiGroups: [""]
    resources: ["configmaps", "events", "pods", "pods/log", "secrets", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devtron-team-a-deployer
  namespace: team-a-dev
  labels:
    app.kubernetes.io/managed-by: akspe-devtron-poc
subjects:
  - kind: ServiceAccount
    name: devtron-team-a-deployer
    namespace: team-a-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devtron-team-a-deployer
---
