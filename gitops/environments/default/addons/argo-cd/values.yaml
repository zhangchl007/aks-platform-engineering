controller:
  replicas: 1 # Additional replicas will cause sharding of managed clusters across number of replicas.
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: true
  env:
    - name: ARGOCD_K8S_CLIENT_QPS #required for Crossplane too many CRDs https://github.com/argoproj/argo-cd/pull/448
      value: '300'

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 1
  resources: # Adjust based on your specific use case (required for HPA)
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      cpu: '200m'
      memory: '512Mi'
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: true

applicationSet:
  replicaCount: 1 # The controller doesn't scale horizontally, is active-standby replicas
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: true

server:
  autoscaling:
    enabled: true
    minReplicas: 1
  resources: # Adjust based on your specific use case (required for HPA)
    requests:
      cpu: '100m'
      memory: '256Mi'
    limits:
      cpu: '200m'
      memory: '512Mi'
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: true
  service:
    type: LoadBalancer
    annotations:
      # https://cloud-provider-azure.sigs.k8s.io/topics/loadbalancer/#loadbalancer-annotations
      service.beta.kubernetes.io/azure-load-balancer-internal: false

configs:
  params:
    controller.diff.server.side: 'true'
  cm:
    url: https://172.179.107.194
    # Keep Backstage -> GitHub PR -> ArgoCD demos responsive after PR merge.
    # ArgoCD's default reconciliation interval plus jitter can leave the
    # backstage-delivery root app on an old Git revision for several minutes.
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 5s
    # Inject Entra OIDC settings from a private deployment overlay. Do not store
    # tenant IDs, client IDs, group IDs, or client secrets in this public repo.
    application.resourceTrackingMethod: 'annotation' #use annotation for tracking required for Crossplane
    resource.exclusions: |
      - kinds:
        - ProviderConfigUsage
        apiGroups:
        - "*"
  rbac:
    # Inject tenant-specific Entra group object IDs from the private overlay.
    # The platform admin group is k8sadmin and must map to ArgoCD admin:
    #
    # policy.csv: |
    #   g, <private-k8sadmin-group-object-id>, role:admin
    #
    # If the live app is reconciled without the private overlay, re-run:
    # scripts/configure-k8sadmin-access.ps1
    #
    policy.default: ''
    scopes: '[groups]'

# -- Array of extra K8s manifests to deploy
## Note: Supports use of custom Helm templates
##       It gets handle in this form inside the argo-cd chart
# {{ range .Values.extraObjects }}
# ---
# {{ if typeIs "string" . }}
#     {{- tpl . $ }}
# {{- else }}
#     {{- tpl (toYaml .) $ }}
# {{- end }}
# {{ end }}
extraObjects:
  - |
    apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: default
      namespace: {{ $.Release.Namespace | quote }}
      annotations:
        source: gitops-brigde
    spec:
      clusterResourceWhitelist:
      - group: '*'
        kind: '*'
      sourceRepos:
        - '*'
      destinations:
        - namespace: '*'
          name: '*'
          server: '*'

global:
  image:
    # repository: quay.io/argoproj/argocd
    # tag: v3.0.0-rc3
    pullPolicy: IfNotPresent
