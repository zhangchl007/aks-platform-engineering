apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-apps
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            environment: control-plane
  template:
    metadata:
      name: cluster-apps
    spec:
      project: default
      source:
        repoURL: '{{metadata.annotations.addons_repo_url}}'
        targetRevision: '{{metadata.annotations.addons_repo_revision}}'
        path: '{{metadata.annotations.addons_repo_basepath}}apps'
        directory:
          recurse: true
          # Only pick up ArgoCD Application manifests (named *-app.yaml).
          # Raw workload manifests (e.g. apps/arc-demo) are intentionally ignored.
          include: '{**/*-app.yaml}'
      destination:
        namespace: 'argocd'
        name: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
